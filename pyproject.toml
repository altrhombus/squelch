[build-system]
# >=77 for PEP 639 SPDX license expressions
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "squelch"
version = "0.1.0"
description = "Self-hosted SDR radio streamer for the Raspberry Pi — FM stereo, AM, HD Radio, and scanner with a mobile-friendly web UI"
readme = "README.md"
# GPL-3.0-or-later: pyrtlsdr (imported as a library) is GPLv3, which is
# incompatible with the GPL-2.0-only this project previously shipped.
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "altrhombus" }]
keywords = ["sdr", "rtl-sdr", "fm", "radio", "streaming", "raspberry-pi", "rds", "hd-radio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4",
    "pyyaml>=6.0.1",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "pyrtlsdr>=0.2.7,<0.3.0",
    "av>=12.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
# FFTW-backed FFTs — worthwhile on the Pi (NEON SIMD); optional everywhere else.
pi = ["pyfftw>=0.13.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/altrhombus/squelch"
Issues = "https://github.com/altrhombus/squelch/issues"

[tool.setuptools]
packages = ["backend", "backend.sdr", "backend.radio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Default rule set (pyflakes + core pycodestyle). The codebase uses aligned
# assignments and long DSP comments, so stylistic rules stay off.
select = ["E4", "E7", "E9", "F"]
# E701: single-line `if x: y` guards are established style here.
# E741: `l` is the natural name for the left audio channel alongside `r`.
ignore = ["E701", "E741"]
