<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>Squelch</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- Ambient art glow — full-page fixed layer, tinted by album art color via CSS vars -->
  <div id="ambient-bg" aria-hidden="true"></div>

  <!-- Desktop toolbar — sticky top bar, visible ≥1024px -->
  <header id="toolbar" role="banner">
    <span id="wordmark">Squelch</span>

    <!-- Band tabs — shown in toolbar on desktop, hidden in tuner column via CSS -->
    <div id="toolbar-band-tabs" role="tablist" aria-label="Frequency band">
      <button class="band-tab active" data-band="fm" role="tab" aria-selected="true">FM</button>
      <button class="band-tab" data-band="hd" role="tab" aria-selected="false">HD</button>
      <button class="band-tab" data-band="wx" role="tab" aria-selected="false">WX</button>
    </div>

    <div id="toolbar-actions">
      <button id="btn-diag-toggle" class="btn-toolbar" aria-label="Toggle diagnostics" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" aria-hidden="true">
          <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
        </svg>
        Diagnostics
      </button>
    </div>
  </header>

  <div id="app-shell">

    <!-- Mini-player — sticky bar, visible when #now-playing scrolls off viewport (tablet/desktop) -->
    <div id="mini-player" class="hidden" role="complementary" aria-label="Mini player">
      <img id="mini-art" src="/static/placeholder.svg" alt="" aria-hidden="true" />
      <div id="mini-info">
        <span id="mini-station"></span>
        <span id="mini-track"></span>
      </div>
      <button id="mini-btn-play" class="btn-icon" aria-label="Play" aria-pressed="false">
        <svg id="mini-icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg id="mini-icon-pause" viewBox="0 0 24 24" fill="currentColor" class="hidden" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <div id="mini-signal-bars" aria-hidden="true">
        <span class="mini-bar" data-n="1"></span>
        <span class="mini-bar" data-n="2"></span>
        <span class="mini-bar" data-n="3"></span>
        <span class="mini-bar" data-n="4"></span>
        <span class="mini-bar" data-n="5"></span>
      </div>
    </div>

    <!-- Three-column layout.
         DOM order matches visual left-to-right on desktop for correct keyboard tab order:
           #center-col (tuner, visual left)
           #left-col   (now-playing, visual center)
           #right-col  (library, visual right)
         CSS grid-column assignments rearrange the visual positions. -->
    <div id="app" data-panel="now-playing">

      <!-- ═══════════════════════════════════════
           TUNER  (#center-col — visual LEFT on desktop)
           ═══════════════════════════════════════ -->
      <div id="center-col">

        <!-- Column header: drag handle + label + collapse button (desktop only) -->
        <div class="col-header" aria-label="Tuner column">
          <button class="col-drag-handle" data-col="center-col" aria-label="Drag to reorder Tuner column" tabindex="0">
            <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
              <circle cx="7" cy="4"  r="1.6"/><circle cx="13" cy="4"  r="1.6"/>
              <circle cx="7" cy="10" r="1.6"/><circle cx="13" cy="10" r="1.6"/>
              <circle cx="7" cy="16" r="1.6"/><circle cx="13" cy="16" r="1.6"/>
            </svg>
          </button>
          <span class="col-label">Tuner</span>
          <button class="col-collapse-btn" data-col="center-col" data-collapsed="false" aria-label="Collapse Tuner column" aria-expanded="true">
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
              <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
          </button>
        </div>

        <section id="tuner-section" data-band="fm">

          <!-- Band tabs — shown on phone/tablet; toolbar carries them on desktop -->
          <div id="band-tabs" role="tablist" aria-label="Frequency band">
            <button class="band-tab active" data-band="fm" role="tab" aria-selected="true">FM</button>
            <button class="band-tab" data-band="hd" role="tab" aria-selected="false">HD</button>
            <button class="band-tab" data-band="wx" role="tab" aria-selected="false">WX</button>
          </div>

          <!-- Frequency display + step buttons (all bands) -->
          <div id="freq-row">
            <button id="btn-step-down" class="btn-icon btn-step" aria-label="Step frequency down">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <div id="freq-display" aria-live="assertive" aria-atomic="true">
              <span id="freq-value">—</span>
              <span id="freq-unit">MHz</span>
            </div>
            <button id="btn-step-up" class="btn-icon btn-step" aria-label="Step frequency up">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
          </div>

          <!-- FM / HD controls — freq strip, dial, manual input (hidden on WX) -->
          <div class="tuner-fm-hd">
            <canvas id="freq-strip" aria-hidden="true"></canvas>
            <div id="dial-wrap">
              <input id="dial" type="range" min="87.5" max="108.0" step="0.1" value="87.5" aria-label="Frequency dial" />
              <div id="dial-ticks" aria-hidden="true"></div>
            </div>
            <div id="freq-input-wrap">
              <label for="freq-input" class="sr-only">Enter frequency</label>
              <input id="freq-input" type="text" inputmode="decimal" placeholder="Frequency" />
              <button id="btn-go">Go</button>
            </div>
          </div>

          <!-- WX channel grid — shown only on WX band (populated by buildWxChannels in app.js) -->
          <div id="wx-channels" class="wx-channels" role="group" aria-label="NOAA weather radio channels"></div>

        </section>

        <!-- Diagnostics drawer — in tuner column; long-press signal meter on phone switches to Tune tab -->
        <details id="diagnostics-drawer">
          <summary>Diagnostics</summary>
          <div class="diag-body">
            <div class="diag-row" id="diag-iq-row">
              <span class="diag-label">IQ RMS <span class="diag-hint">(sat.)</span></span>
              <div class="diag-track"><div class="diag-fill" id="diag-iq-bar"></div></div>
              <span class="diag-num" id="diag-iq-val">—</span>
            </div>
            <div class="diag-row" id="diag-comp-row">
              <span class="diag-label">Composite <span class="diag-hint">(FM)</span></span>
              <div class="diag-track"><div class="diag-fill" id="diag-comp-bar"></div></div>
              <span class="diag-num" id="diag-comp-val">—</span>
            </div>
            <div class="diag-row" id="diag-pilot-row">
              <span class="diag-label">Pilot <span class="diag-hint">(19 kHz)</span></span>
              <div class="diag-track"><div class="diag-fill" id="diag-pilot-bar"></div></div>
              <span class="diag-num" id="diag-pilot-val">—</span>
            </div>
            <div class="diag-row" id="diag-noise-row">
              <span class="diag-label">Noise floor</span>
              <div class="diag-track"><div class="diag-fill" id="diag-noise-bar"></div></div>
              <span class="diag-num" id="diag-noise-val">—</span>
            </div>
            <div class="diag-row" id="diag-blend-row">
              <span class="diag-label">Stereo blend</span>
              <div class="diag-track"><div class="diag-fill" id="diag-blend-bar"></div></div>
              <span class="diag-num" id="diag-blend-val">—</span>
            </div>
            <div class="diag-row">
              <span class="diag-label">Audio RMS</span>
              <div class="diag-track"><div class="diag-fill" id="diag-audio-bar"></div></div>
              <span class="diag-num" id="diag-audio-val">—</span>
            </div>
            <div class="diag-row" id="diag-gain-row">
              <span class="diag-label">SDR Gain</span>
              <div class="diag-track"><div class="diag-fill" id="diag-gain-bar"></div></div>
              <span class="diag-num" id="diag-gain-val">—</span>
            </div>
            <button id="btn-copy-diag" class="btn-small" style="margin-top:10px">Copy as JSON</button>
          </div>
        </details>

      </div><!-- #center-col -->

      <!-- ═══════════════════════════════════════
           NOW PLAYING  (#left-col — visual CENTER on desktop)
           ═══════════════════════════════════════ -->
      <div id="left-col">

        <!-- Now-playing column: drag handle only (not collapsible) -->
        <div class="col-header col-header-center" aria-label="Now Playing column">
          <button class="col-drag-handle" data-col="left-col" aria-label="Drag to reorder Now Playing column" tabindex="0">
            <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
              <circle cx="7" cy="4"  r="1.6"/><circle cx="13" cy="4"  r="1.6"/>
              <circle cx="7" cy="10" r="1.6"/><circle cx="13" cy="10" r="1.6"/>
              <circle cx="7" cy="16" r="1.6"/><circle cx="13" cy="16" r="1.6"/>
            </svg>
          </button>
        </div>

        <header id="now-playing" aria-label="Now Playing">

          <!-- Full-bleed blurred art background -->
          <div id="art-blur-bg" aria-hidden="true"></div>

          <!-- WebSocket reconnect indicator -->
          <div id="ws-status" class="hidden" title="Reconnecting…" aria-label="Reconnecting" aria-live="polite"></div>

          <!-- Hero content: art column + metadata column -->
          <div id="now-playing-content">

            <!-- Art + signal bars -->
            <div id="art-col">
              <div id="art-wrap">
                <img id="art-back" src="/static/placeholder.svg" alt="" aria-hidden="true" />
                <img id="art" src="/static/placeholder.svg" alt="Cover art" />
              </div>
              <div id="signal-meter" role="img" aria-label="Signal: no signal">
                <span class="bar" data-n="1"></span>
                <span class="bar" data-n="2"></span>
                <span class="bar" data-n="3"></span>
                <span class="bar" data-n="4"></span>
                <span class="bar" data-n="5"></span>
              </div>
            </div>

            <!-- Metadata + controls -->
            <div id="now-info">
              <div id="meta-badges">
                <div id="hd-badge" class="badge hidden">HD</div>
                <div id="pty-badge" class="badge hidden"></div>
              </div>
              <p id="station-name" aria-live="polite">Squelch</p>
              <p id="station-slogan" class="muted hidden"></p>

              <!-- HD sub-channel selector — rendered by applyMeta when hd_locked + multiple channels -->
              <div id="hd-channels" class="hidden" role="group" aria-label="HD Radio channels"></div>

              <div id="track-info" aria-live="polite">
                <p id="track-artist" class="hidden"></p>
                <p id="track-title" class="muted">Ready to tune</p>
              </div>

              <div id="player-controls">
                <button id="btn-play" class="btn-icon" aria-label="Play" aria-pressed="false">
                  <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                  <svg id="icon-stop" viewBox="0 0 24 24" fill="currentColor" class="hidden" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
                </button>
                <div id="volume-wrap">
                  <svg viewBox="0 0 24 24" fill="currentColor" width="18" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                  <input id="volume" type="range" min="0" max="1" step="0.02" value="1" aria-label="Volume" />
                </div>
                <button id="btn-record" class="btn-icon" aria-label="Start recording" aria-pressed="false">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>
                </button>
                <span id="rec-elapsed" class="rec-elapsed" aria-live="off"></span>
              </div>
            </div><!-- #now-info -->

          </div><!-- #now-playing-content -->

          <!-- Hidden audio element -->
          <audio id="player" preload="none" playsinline></audio>

        </header>
      </div><!-- #left-col -->

      <!-- ═══════════════════════════════════════
           LIBRARY  (#right-col — visual RIGHT on desktop)
           ═══════════════════════════════════════ -->
      <div id="right-col">

        <!-- Column header: collapse button + label + drag handle (desktop only) -->
        <div class="col-header" aria-label="Library column">
          <button class="col-collapse-btn" data-col="right-col" data-collapsed="false" aria-label="Collapse Library column" aria-expanded="true">
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
              <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
          </button>
          <span class="col-label">Library</span>
          <button class="col-drag-handle" data-col="right-col" aria-label="Drag to reorder Library column" tabindex="0">
            <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
              <circle cx="7" cy="4"  r="1.6"/><circle cx="13" cy="4"  r="1.6"/>
              <circle cx="7" cy="10" r="1.6"/><circle cx="13" cy="10" r="1.6"/>
              <circle cx="7" cy="16" r="1.6"/><circle cx="13" cy="16" r="1.6"/>
            </svg>
          </button>
        </div>

        <!-- Library section tabs -->
        <div class="lib-tabs" role="tablist" aria-label="Library sections">
          <button id="lib-tab-presets"    class="lib-tab active" data-lib="presets"    role="tab" aria-selected="true"  aria-controls="presets-section">Presets</button>
          <button id="lib-tab-history"    class="lib-tab"        data-lib="history"    role="tab" aria-selected="false" aria-controls="history-section">History</button>
          <button id="lib-tab-recordings" class="lib-tab"        data-lib="recordings" role="tab" aria-selected="false" aria-controls="recordings-section">Recordings</button>
        </div>

        <section id="presets-section" role="tabpanel" aria-labelledby="lib-tab-presets">
          <div id="presets-header">
            <button id="btn-save-preset" class="btn-small">+ Save current</button>
          </div>
          <div id="presets-list"></div>
        </section>

        <section id="history-section" class="hidden" role="tabpanel" aria-labelledby="lib-tab-history">
          <div id="history-list"></div>
        </section>

        <section id="recordings-section" class="hidden" role="tabpanel" aria-labelledby="lib-tab-recordings">
          <div id="recordings-list"></div>
        </section>

      </div><!-- #right-col -->

    </div><!-- #app -->
  </div><!-- #app-shell -->

  <!-- Bottom navigation — phone only (hidden on tablet/desktop) -->
  <nav id="bottom-nav" role="tablist" aria-label="App sections">
    <button class="nav-tab active" data-panel="now-playing" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <span>Now Playing</span>
    </button>
    <button class="nav-tab" data-panel="tune" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v4H6zm3 0h2v4H9zm3 0h6v4h-6z"/></svg>
      <span>Tune</span>
    </button>
    <button class="nav-tab" data-panel="library" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
      <span>Library</span>
    </button>
  </nav>

  <!-- Save preset modal -->
  <div id="modal-preset" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-preset-title">
    <div class="modal-box">
      <h3 id="modal-preset-title">Save preset</h3>
      <label for="preset-name-input" class="sr-only">Station name</label>
      <input id="preset-name-input" type="text" placeholder="Station name" />
      <div class="modal-actions">
        <button id="btn-preset-cancel" class="btn-small">Cancel</button>
        <button id="btn-preset-save" class="btn-small primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Signal strength tooltip -->
  <div id="signal-tooltip" role="tooltip" aria-hidden="true"></div>

  <!-- Canvas for dominant color extraction from album art -->
  <canvas id="color-canvas" width="8" height="8" aria-hidden="true" style="display:none"></canvas>

  <!-- Toast notifications -->
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <script src="/static/app.js"></script>
</body>
</html>
