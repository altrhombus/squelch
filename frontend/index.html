<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Squelch</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">

    <!-- Now Playing -->
    <header id="now-playing">
      <div id="art-wrap">
        <img id="art" src="/static/placeholder.svg" alt="Cover art" />
        <div id="hd-badge" class="badge hidden">HD</div>
      </div>
      <div id="now-info">
        <div id="pty-badge" class="badge hidden"></div>
        <p id="station-name">Squelch</p>
        <p id="track-info" class="muted">Ready to tune</p>
        <div id="signal-meter">
          <span class="bar" data-n="1"></span>
          <span class="bar" data-n="2"></span>
          <span class="bar" data-n="3"></span>
          <span class="bar" data-n="4"></span>
          <span class="bar" data-n="5"></span>
          <span id="stereo-indicator" class="hidden">ST</span>
        </div>
      </div>
    </header>

    <!-- Player -->
    <section id="player-section">
      <audio id="player" preload="none" playsinline></audio>
      <div id="player-controls">
        <button id="btn-play" class="btn-icon" title="Play / Pause">
          <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <div id="volume-wrap">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          <input id="volume" type="range" min="0" max="1" step="0.02" value="1" />
        </div>
        <button id="btn-record" class="btn-icon" title="Record">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        </button>
      </div>
    </section>

    <!-- Tuner -->
    <section id="tuner-section">
      <div id="band-tabs">
        <button class="band-tab active" data-band="fm">FM</button>
        <button class="band-tab" data-band="hd">HD</button>
        <button class="band-tab" data-band="am">AM</button>
        <button class="band-tab" data-band="scanner">SCAN</button>
      </div>

      <div id="freq-display">
        <span id="freq-value">—</span>
        <span id="freq-unit">MHz</span>
      </div>

      <div id="dial-wrap">
        <input
          id="dial"
          type="range"
          min="87.5" max="108.0" step="0.1"
          value="87.5"
        />
        <div id="dial-ticks"></div>
      </div>

      <div id="freq-input-wrap">
        <input id="freq-input" type="number" step="0.1" placeholder="Frequency" />
        <button id="btn-go">Go</button>
      </div>
    </section>

    <!-- Presets -->
    <section id="presets-section">
      <div id="presets-header">
        <h2>Presets</h2>
        <button id="btn-save-preset" class="btn-small">+ Save current</button>
      </div>
      <div id="presets-list"></div>
    </section>

    <!-- Recordings -->
    <section id="recordings-section">
      <h2>Recordings</h2>
      <div id="recordings-list"></div>
    </section>

    <!-- Quality drawer (collapsed by default) -->
    <details id="quality-drawer">
      <summary>Signal &amp; Quality</summary>
      <div class="drawer-body">
        <label>
          Stereo mode
          <select id="sel-stereo">
            <option value="auto" selected>Auto blend</option>
            <option value="stereo">Force stereo</option>
            <option value="mono">Force mono</option>
          </select>
        </label>
        <label>
          Bandwidth
          <select id="sel-bandwidth">
            <option value="wide" selected>Wide (200 kHz)</option>
            <option value="narrow">Narrow (130 kHz)</option>
          </select>
        </label>
        <label>
          SDR gain
          <select id="sel-gain">
            <option value="auto" selected>Auto (AGC)</option>
            <option value="10">10 dB</option>
            <option value="20">20 dB</option>
            <option value="30">30 dB</option>
            <option value="40">40 dB</option>
            <option value="50">50 dB</option>
          </select>
        </label>
        <label>
          Squelch threshold
          <input id="input-squelch" type="range" min="0" max="100" value="0" />
          <span id="squelch-val">0</span>
        </label>
      </div>
    </details>

  </div><!-- #app -->

  <!-- Save preset modal -->
  <div id="modal-preset" class="modal hidden">
    <div class="modal-box">
      <h3>Save preset</h3>
      <input id="preset-name-input" type="text" placeholder="Station name" />
      <div class="modal-actions">
        <button id="btn-preset-cancel" class="btn-small">Cancel</button>
        <button id="btn-preset-save" class="btn-small primary">Save</button>
      </div>
    </div>
  </div>

  <!-- hls.js — loaded only for non-Safari browsers -->
  <script>
    // Safari has native HLS support; hls.js is only needed for Chrome/Firefox
    if (!window.MediaSource) {
      // Safari — native HLS
      window.__nativeHLS = true;
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
