<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Squelch</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
  <div id="left-col">

    <!-- Now Playing hero (player controls live here) -->
    <header id="now-playing">
      <div id="art-blur-bg"></div>
      <!-- Signal meter — top-left, absolute -->
      <div id="signal-meter" role="img" aria-label="Signal: no signal">
        <span class="bar" data-n="1"></span>
        <span class="bar" data-n="2"></span>
        <span class="bar" data-n="3"></span>
        <span class="bar" data-n="4"></span>
        <span class="bar" data-n="5"></span>
      </div>
      <!-- WS reconnect badge — top-right, absolute -->
      <div id="ws-status" class="hidden" title="Reconnecting…"></div>
      <div id="now-playing-content">

        <div id="art-wrap">
          <img id="art-back" src="/static/placeholder.svg" alt="" aria-hidden="true" />
          <img id="art" src="/static/placeholder.svg" alt="Cover art" />
          <div id="hd-badge" class="badge hidden">HD</div>
        </div>

        <div id="now-info">
          <div id="meta-badges">
            <div id="pty-badge" class="badge hidden"></div>
          </div>
          <p id="station-name" aria-live="polite">Squelch</p>
          <p id="station-slogan" class="muted hidden"></p>
          <p id="track-info" class="muted" aria-live="polite">Ready to tune</p>
        </div>

        <audio id="player" preload="none" playsinline></audio>
        <div id="player-controls">
          <button id="btn-play" class="btn-icon" aria-label="Play" aria-pressed="false">
            <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" class="hidden" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <div id="volume-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor" width="18" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <input id="volume" type="range" min="0" max="1" step="0.02" value="1" aria-label="Volume" />
          </div>
          <button id="btn-record" class="btn-icon" aria-label="Start recording" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>
          </button>
        </div>

      </div><!-- #now-playing-content -->
    </header>

    <!-- Post-processing meter panel (collapsible, FM only) -->
    <div id="pp-panel" class="hidden">
      <div id="pp-header" role="button" tabindex="0" aria-expanded="false"
           aria-controls="pp-body" title="Expand post-processing details">
        <label class="pp-toggle" title="Enable post-processing" id="pp-master-wrap"
               onclick="event.stopPropagation()">
          <input type="checkbox" id="pp-master-toggle" aria-label="Enable post-processing">
          <span class="pp-slider"></span>
        </label>
        <span id="pp-header-label">ENHANCED</span>
        <button id="btn-pp-bypass" class="btn-small" aria-pressed="false"
                title="Bypass all post-processing for A/B comparison">Bypass</button>
        <span id="pp-chevron" aria-hidden="true">&#9660;</span>
      </div>
      <div id="pp-body" class="hidden" role="region" aria-label="Post-processing details">
        <div class="pp-row pp-row-signal">
          <span class="pp-label">Signal</span>
          <div class="pp-bar-wrap"><div id="pp-bar-signal" class="pp-bar"></div></div>
          <span id="pp-val-signal" class="pp-val">—</span>
        </div>
        <div class="pp-row">
          <label class="pp-toggle" title="Enable M/S noise reduction">
            <input type="checkbox" class="pp-mod-toggle" data-module="ms"
                   aria-label="Enable M/S noise reduction">
            <span class="pp-slider"></span>
          </label>
          <span class="pp-label">M/S NR</span>
          <div class="pp-bar-wrap"><div id="pp-bar-ms" class="pp-bar"></div></div>
          <span id="pp-val-ms" class="pp-val">—</span>
        </div>
        <div class="pp-row">
          <label class="pp-toggle" title="Enable multiband compressor">
            <input type="checkbox" class="pp-mod-toggle" data-module="compress"
                   aria-label="Enable multiband compressor">
            <span class="pp-slider"></span>
          </label>
          <span class="pp-label">Compress</span>
          <div class="pp-bar-wrap"><div id="pp-bar-comp" class="pp-bar"></div></div>
          <span id="pp-val-comp" class="pp-val">—</span>
        </div>
        <div class="pp-row">
          <label class="pp-toggle" title="Enable harmonic exciter">
            <input type="checkbox" class="pp-mod-toggle" data-module="exciter"
                   aria-label="Enable harmonic exciter">
            <span class="pp-slider"></span>
          </label>
          <span class="pp-label">Exciter</span>
          <div class="pp-bar-wrap"><div id="pp-bar-exc" class="pp-bar"></div></div>
          <span id="pp-val-exc" class="pp-val">—</span>
        </div>
        <div class="pp-row">
          <label class="pp-toggle" title="Enable comfort noise">
            <input type="checkbox" class="pp-mod-toggle" data-module="comfort_noise"
                   aria-label="Enable comfort noise">
            <span class="pp-slider"></span>
          </label>
          <span class="pp-label">Comfort</span>
          <div class="pp-bar-wrap"><div id="pp-bar-cn" class="pp-bar"></div></div>
          <span id="pp-val-cn" class="pp-val">—</span>
        </div>
        <div class="pp-row">
          <label class="pp-toggle" title="Enable warmth EQ">
            <input type="checkbox" class="pp-mod-toggle" data-module="warmth_eq"
                   aria-label="Enable warmth EQ">
            <span class="pp-slider"></span>
          </label>
          <span class="pp-label">Warmth EQ</span>
          <div class="pp-bar-wrap"><div id="pp-bar-weq" class="pp-bar"></div></div>
          <span id="pp-val-weq" class="pp-val">—</span>
        </div>
      </div>
    </div>

    <!-- History (left column, below hero) -->
    <section id="history-section">
      <h2>History</h2>
      <div id="history-list"></div>
    </section>

  </div><!-- #left-col -->
  <div id="right-col">

    <!-- Tuner -->
    <section id="tuner-section">
      <div id="band-tabs" role="tablist" aria-label="Frequency band">
        <button class="band-tab active" data-band="fm" role="tab" aria-selected="true">FM</button>
        <button class="band-tab" data-band="hd" role="tab" aria-selected="false">HD</button>
        <button class="band-tab" data-band="am" role="tab" aria-selected="false">AM</button>
        <button class="band-tab" data-band="scanner" role="tab" aria-selected="false">SCAN</button>
      </div>

      <div id="freq-row">
        <button id="btn-step-down" class="btn-icon btn-step" aria-label="Step frequency down">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <div id="freq-display" aria-live="assertive" aria-atomic="true">
          <span id="freq-value">—</span>
          <span id="freq-unit">MHz</span>
        </div>
        <button id="btn-step-up" class="btn-icon btn-step" aria-label="Step frequency up">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
      </div>

      <div id="dial-wrap">
        <input id="dial" type="range" min="87.5" max="108.0" step="0.1" value="87.5" aria-label="Frequency dial" />
        <div id="dial-ticks" aria-hidden="true"></div>
      </div>

      <div id="freq-input-wrap">
        <label for="freq-input" class="sr-only">Enter frequency</label>
        <input id="freq-input" type="number" step="0.1" placeholder="Frequency" />
        <button id="btn-go">Go</button>
      </div>
    </section>

    <!-- Presets (right column, near tuner) -->
    <section id="presets-section">
      <div id="presets-header">
        <h2>Presets</h2>
        <button id="btn-save-preset" class="btn-small">+ Save current</button>
      </div>
      <div id="presets-list"></div>
    </section>

    <!-- Recordings -->
    <section id="recordings-section">
      <h2>Recordings</h2>
      <div id="recordings-list"></div>
    </section>

  </div><!-- #right-col -->
  </div><!-- #app -->

  <!-- Save preset modal -->
  <div id="modal-preset" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-preset-title">
    <div class="modal-box">
      <h3 id="modal-preset-title">Save preset</h3>
      <label for="preset-name-input" class="sr-only">Station name</label>
      <input id="preset-name-input" type="text" placeholder="Station name" />
      <div class="modal-actions">
        <button id="btn-preset-cancel" class="btn-small">Cancel</button>
        <button id="btn-preset-save" class="btn-small primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Signal strength tooltip -->
  <div id="signal-tooltip" role="tooltip" aria-hidden="true"></div>

  <!-- No hls.js needed — audio is served as a direct AAC/ADTS HTTP stream -->
  <script src="/static/app.js"></script>
</body>
</html>
