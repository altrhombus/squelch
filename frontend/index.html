<!DOCTYPE html>
<html lang="en" data-glass="regular">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>Squelch</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- Ambient art glow — full-page fixed layer, tinted by album art color -->
  <div id="ambient-bg" aria-hidden="true"></div>

  <div id="frame">

    <!-- ═══════════════════════════════════════════════════════
         LIBRARY — flush glass sidebar (desktop) / Library tab (phone)
         ═══════════════════════════════════════════════════════ -->
    <aside id="sidebar" aria-label="Library">
      <div id="sidebar-head">
        <span class="wordmark">Squelch</span>
        <button id="btn-settings" class="btn-ghost" aria-label="Settings" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="currentColor" width="17" height="17" aria-hidden="true">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.484.484 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.61 3.61 0 0 1 8.4 12c0-1.98 1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
      </div>

      <div class="seg" id="lib-tabs" role="tablist" aria-label="Library sections">
        <button class="seg-btn active" data-lib="presets"    role="tab" aria-selected="true">Presets</button>
        <button class="seg-btn" data-lib="history"    role="tab" aria-selected="false">History</button>
        <button class="seg-btn" data-lib="recordings" role="tab" aria-selected="false">Recordings</button>
      </div>

      <div id="lib-body">
        <section id="presets-section" role="tabpanel" aria-label="Presets">
          <div id="presets-list" class="lib-list"></div>
          <button id="btn-save-preset" class="btn-wide">Save current station</button>
        </section>
        <section id="history-section" class="hidden" role="tabpanel" aria-label="History">
          <div id="history-list" class="lib-list"></div>
        </section>
        <section id="recordings-section" class="hidden" role="tabpanel" aria-label="Recordings">
          <div id="recordings-list" class="lib-list"></div>
        </section>
      </div>
    </aside>

    <!-- ═══════════════════════════════════════════════════════
         RADIO — the one continuous surface
         ═══════════════════════════════════════════════════════ -->
    <main id="radio" aria-label="Radio">

      <!-- Floating status row: wordmark (phone), badges, signal -->
      <div id="status-row">
        <span class="wordmark phone-only">Squelch</span>
        <button id="btn-settings-phone" class="btn-ghost phone-only" aria-label="Settings" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="currentColor" width="17" height="17" aria-hidden="true">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.484.484 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.61 3.61 0 0 1 8.4 12c0-1.98 1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
        <span class="spacer"></span>
        <div id="badges">
          <span id="ws-status" class="badge badge-warn hidden" aria-live="polite">Reconnecting…</span>
          <span id="pty-badge"    class="badge hidden"></span>
          <span id="stereo-badge" class="badge hidden">STEREO</span>
          <button id="hd-badge" class="badge hidden">HD</button>
        </div>
        <button id="signal-cluster" aria-label="Signal details" aria-haspopup="dialog">
          <span id="signal-meter" role="img" aria-label="Signal: no signal">
            <span class="bar" data-n="1"></span><span class="bar" data-n="2"></span>
            <span class="bar" data-n="3"></span><span class="bar" data-n="4"></span>
            <span class="bar" data-n="5"></span>
          </span>
        </button>
      </div>

      <!-- Hero: art + metadata + transport -->
      <section id="hero">
        <div id="art-blur-bg" aria-hidden="true"></div>
        <div id="hero-inner">
          <div id="art-wrap">
            <img id="art-back" src="/static/placeholder.svg" alt="" aria-hidden="true" />
            <img id="art" src="/static/placeholder.svg" alt="Cover art" />
          </div>
          <div id="now-info">
            <p id="station-name" aria-live="polite">Squelch</p>
            <p id="station-slogan" class="muted hidden"></p>
            <div id="hd-channels" class="hidden" role="group" aria-label="HD Radio channels"></div>
            <div id="track-info" aria-live="polite">
              <p id="track-title" class="muted">Ready to tune</p>
              <p id="track-artist" class="hidden"></p>
            </div>
            <div id="transport">
              <button id="btn-play" class="btn-play" aria-label="Play" aria-pressed="false">
                <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                <svg id="icon-stop" viewBox="0 0 24 24" fill="currentColor" class="hidden" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
              </button>
              <div id="volume-wrap">
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <input id="volume" type="range" min="0" max="1" step="0.02" value="1" aria-label="Volume" />
              </div>
              <button id="btn-record" class="btn-round" aria-label="Start recording" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="7"/></svg>
              </button>
              <span id="rec-elapsed" aria-live="off"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- Tuner: readout + ruler / band-specific panels -->
      <section id="tuner">
        <div id="readout-row">
          <div id="readout" aria-live="off">
            <span id="freq-value">—</span><span id="freq-unit">MHz</span>
          </div>
          <span id="seek-state" class="hidden" aria-live="polite">Seeking…</span>
        </div>

        <div id="ruler-row">
          <button id="btn-step-down" class="btn-chev" aria-label="Step down — hold to seek">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <canvas id="ruler" aria-label="Frequency dial" role="slider" tabindex="0"
                  aria-valuemin="87.5" aria-valuemax="108" aria-valuenow="87.5"></canvas>
          <button id="btn-step-up" class="btn-chev" aria-label="Step up — hold to seek">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
          </button>
        </div>

        <!-- WX: seven NOAA channels -->
        <div id="wx-panel" class="band-panel hidden" role="group" aria-label="NOAA weather channels"></div>

        <!-- Scanner: direct entry + squelch -->
        <div id="scan-panel" class="band-panel hidden">
          <div id="keypad" role="group" aria-label="Frequency keypad"></div>
          <p id="scan-hint" class="muted">Enter a frequency in MHz — aviation is decoded as AM, everything else as narrow FM.</p>
        </div>

        <!-- Squelch — shown for WX + Scanner -->
        <div id="squelch-row" class="hidden">
          <label for="squelch">Squelch</label>
          <input id="squelch" type="range" min="0" max="100" step="5" value="0" />
          <span id="squelch-val" class="muted">Off</span>
        </div>

        <div class="seg" id="band-tabs" role="tablist" aria-label="Band">
          <button class="seg-btn active" data-band="fm"      role="tab" aria-selected="true">FM</button>
          <button class="seg-btn" data-band="hd"      role="tab" aria-selected="false">HD</button>
          <button class="seg-btn" data-band="am"      role="tab" aria-selected="false">AM</button>
          <button class="seg-btn" data-band="wx"      role="tab" aria-selected="false">WX</button>
          <button class="seg-btn" data-band="scanner" role="tab" aria-selected="false">Scan</button>
        </div>
      </section>

    </main>
  </div><!-- #frame -->

  <!-- Phone tab bar — floating glass, adaptive contrast -->
  <nav id="tabbar" role="tablist" aria-label="App sections">
    <button class="tab active" data-panel="radio" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2H8.3l8.26-3.34L13.88.5 3.24 6.15zM7 20a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm13-8h-2v-2h-2v2H4V8h16v4z"/></svg>
      <span>Radio</span>
    </button>
    <button class="tab" data-panel="library" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
      <span>Library</span>
    </button>
  </nav>

  <!-- Signal details popover -->
  <div id="diag-popover" class="popover hidden" role="dialog" aria-modal="false" aria-label="Signal details">
    <div class="popover-head">
      <span>Signal details</span>
      <button class="btn-ghost popover-close" aria-label="Close">✕</button>
    </div>
    <div class="diag-body" id="diag-body"></div>
    <button id="btn-copy-diag" class="btn-wide">Copy as JSON</button>
  </div>

  <!-- Settings popover -->
  <div id="settings-popover" class="popover hidden" role="dialog" aria-modal="false" aria-label="Settings">
    <div class="popover-head">
      <span>Settings</span>
      <button class="btn-ghost popover-close" aria-label="Close">✕</button>
    </div>
    <div class="settings-body">
      <label class="settings-label" id="glass-label">Glass</label>
      <div class="seg" id="glass-seg" role="radiogroup" aria-labelledby="glass-label">
        <button class="seg-btn" data-glass="clear"   role="radio" aria-checked="false">Clear</button>
        <button class="seg-btn active" data-glass="regular" role="radio" aria-checked="true">Regular</button>
        <button class="seg-btn" data-glass="tinted"  role="radio" aria-checked="false">Tinted</button>
      </div>
    </div>
  </div>

  <!-- Save preset modal -->
  <div id="modal-preset" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-preset-title">
    <div class="modal-box">
      <h3 id="modal-preset-title">Save preset</h3>
      <label for="preset-name-input" class="sr-only">Station name</label>
      <input id="preset-name-input" type="text" placeholder="Station name" />
      <div class="modal-actions">
        <button id="btn-preset-cancel" class="btn-plain">Cancel</button>
        <button id="btn-preset-save" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <canvas id="color-canvas" width="8" height="8" aria-hidden="true" style="display:none"></canvas>
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>
  <audio id="player" preload="none" playsinline></audio>

  <script src="/static/app.js"></script>
</body>
</html>
