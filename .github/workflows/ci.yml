name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No SDR hardware or librtlsdr needed: the test suite exercises the DSP
      # with synthetic IQ signals and everything else with fakes.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check backend/ tests/

      - name: Test
        run: pytest -q

      - name: Frontend syntax check
        run: node --check frontend/app.js

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Headless Chromium drives the real page against the app running
      # in-process; control endpoints are intercepted and WebSocket frames
      # injected, so no SDR hardware is needed here either.
      - name: Install
        run: |
          pip install -e ".[dev,ui]"
          python -m playwright install --with-deps chromium

      - name: UI smoke tests
        run: pytest -q tests/ui
